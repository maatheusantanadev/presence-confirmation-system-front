<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Controle de Presença</title>
    <link rel="stylesheet" href="assets/css/Dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Sistema Presença</h2>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="active"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="Turmas.html"><i class="fas fa-users-rectangle"></i> Turmas</a>
            <a href="Alunos.html"><i class="fas fa-user-graduate"></i> Alunos</a>
            <a href="Listagem_presenca.html"><i class="fas fa-clipboard-check"></i> Presenças</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Dashboard</h1>
            <div class="user-info">
                <span id="userName"><a href="index.html">Sair</a></span>
                <div class="avatar">P</div>
            </div>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon blue">
                    <i class="fas fa-school"></i>
                </div>
                <div class="stat-info">
                   <h3>Total de Turmas</h3>
                    <p id="totalAlunos">0</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon green">
                    <i class="fas fa-check-circle"></i>
                </div>
                <div class="stat-info">
                   <h3>Presenças Confirmadas</h3>
                    <p id="totalPresencas">0</p>
                </div>
            </div>
        </section>

        <section class="actions-section">
            <h3>Gerenciamento</h3>
            <div class="actions-grid">
                <button class="action-btn" onclick="location.href='Alunos.html'">
                    <i class="fas fa-user-plus"></i>
                    Gerenciar Alunos
                </button>
                <button class="action-btn secondary" onclick="location.href='Turmas.html'">
                    <i class="fas fa-plus-circle"></i>
                    Gerenciar Turmas
                </button>
                <button class="action-btn outline" onclick="location.href='Presencas.html'">
                    <i class="fas fa-eye"></i>
                    Visualizar Presenças
                </button>
            </div>

            <div class="qr-container animate-in">
                <div class="qr-header">
                    <h2><i class="fas fa-qrcode"></i> Registrar Presença</h2>
                    <p>Selecione a turma e projete o código. Os alunos escaneiam o QR ou digitam o código.</p>
                </div>

                <!-- Seletor de turma (necessário para gerar o código daquela turma) -->
                <div class="form-group" style="margin: 0 auto 1.25rem; max-width: 340px;">
                    <select id="dashboardGroupSelect"
                        style="width:100%; padding:.85rem 1rem; border:1px solid var(--border, #e2e8f0); border-radius:12px; font-size:1rem; background:#fff; appearance:none;">
                        <option value="">Selecione a turma...</option>
                    </select>
                </div>

                <!-- Código dinâmico (texto grande) + contador de renovação -->
                <div id="codeDisplay"
                    style="font-size:2.6rem; font-weight:800; letter-spacing:8px; color:#2563eb; text-align:center; line-height:1.1; margin-bottom:.25rem;">—</div>
                <small id="codeCountdown"
                    style="display:block; text-align:center; color:#64748b; margin-bottom:1.25rem; min-height:1em;"></small>

                <!-- QR Code -->
                <div id="qrcode" class="qr-code-box"></div>
            </div>
        </section>
    </main>

    <script src="assets/js/Dashboard.js"></script>
</body>
</html>
